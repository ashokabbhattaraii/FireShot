<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<title>FireSlot Nepal</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{color-scheme:dark}
html,body{min-height:100%;background:#090912;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
body{display:flex;align-items:center;justify-content:center;padding:24px;padding-top:calc(24px + env(safe-area-inset-top));padding-bottom:calc(24px + env(safe-area-inset-bottom))}
.shell{width:min(420px,100%);text-align:center}
.mark{width:64px;height:64px;margin:0 auto 18px;border-radius:18px;display:grid;place-items:center;background:linear-gradient(135deg,#E53935,#0EA5E9);box-shadow:0 18px 48px rgba(229,57,53,.25);font-size:31px}
.eyebrow{color:#fb7185;font-size:11px;font-weight:800;letter-spacing:.22em;text-transform:uppercase}
h1{margin-top:8px;font-size:26px;line-height:1.15;letter-spacing:.01em}
p{margin:12px auto 0;max-width:310px;color:rgba(255,255,255,.68);font-size:14px;line-height:1.5}
.status{margin-top:22px;display:flex;align-items:center;justify-content:center;gap:8px;color:rgba(255,255,255,.72);font-size:13px}
.dot{width:9px;height:9px;border-radius:99px;background:#22c55e;box-shadow:0 0 18px #22c55e;animation:pulse 1s ease-in-out infinite}
.actions{display:none;margin-top:26px;gap:12px}
button{appearance:none;border:0;border-radius:8px;height:46px;padding:0 18px;font-weight:800;font-size:14px;color:#fff}
.primary{background:#ef4444;box-shadow:0 12px 30px rgba(239,68,68,.28)}
.secondary{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.16)}
.offline .dot{background:#ef4444;box-shadow:0 0 18px rgba(239,68,68,.8);animation:none}
.offline .actions{display:flex;justify-content:center}
@keyframes pulse{0%,100%{opacity:.45;transform:scale(.88)}50%{opacity:1;transform:scale(1.12)}}
</style>
</head>
<body>
<main class="shell" id="shell">
  <div class="mark" aria-hidden="true">&#x1F525;</div>
  <div class="eyebrow">FireSlot Nepal</div>
  <h1 id="title">Opening the arena</h1>
  <p id="message">Connecting securely to FireSlot Nepal. This usually takes a moment.</p>
  <div class="status"><span class="dot"></span><span id="statusText">Checking connection...</span></div>
  <div class="actions">
    <button class="primary" type="button" onclick="retry()">Retry</button>
    <button class="secondary" type="button" onclick="exitApp()">Exit</button>
  </div>
</main>
<script>
(function(){
  var shell=document.getElementById('shell');
  var title=document.getElementById('title');
  var message=document.getElementById('message');
  var statusText=document.getElementById('statusText');

  function showOffline(){
    shell.classList.add('offline');
    title.textContent='No internet connection';
    message.textContent='FireSlot Nepal needs internet to load tournaments, wallet, matches, and Google sign-in. Connect to Wi-Fi or mobile data, then retry.';
    statusText.textContent='Offline';
  }

  function showConnecting(){
    shell.classList.remove('offline');
    title.textContent='Opening the arena';
    message.textContent='Connecting securely to FireSlot Nepal. This usually takes a moment.';
    statusText.textContent='Checking connection...';
  }

  window.retry=function(){ location.reload(); };
  window.exitApp=function(){
    try {
      var app = window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.App;
      if (app && app.exitApp) { app.exitApp(); return; }
    } catch(e) {}
    try { window.close(); } catch(e) {}
  };

  if (navigator.onLine === false) showOffline(); else showConnecting();
  window.addEventListener('offline', showOffline);
  window.addEventListener('online', function(){ showConnecting(); setTimeout(function(){ location.reload(); }, 300); });
  setTimeout(function(){
    if (document.visibilityState !== 'hidden' && navigator.onLine === false) showOffline();
  }, 1200);
  setTimeout(function(){
    if (document.visibilityState !== 'hidden') showOffline();
  }, 8500);
})();
</script>
</body>
</html>
